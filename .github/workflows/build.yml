name: build-wf
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Long Paths in Git (Linux)
        if: runner.os == 'Linux'
        run: sudo git config --system core.longpaths true
      - name: Enable Long Paths in Git (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          cache: 'maven'
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cd scripts && ./build
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cd scripts && .\build.bat
      - name: Store P2 Repositories
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: p2-cipm
          path: |
            commit-based-cipm/releng/cipm.consistency.updatesite.ti/target/cipm*.zip
